<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS • Anime Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cyan:#35d9ff;
  --blue:#178cff;
  --glass:rgba(5,30,72,.48);
  --line:rgba(130,220,255,.22);
  --text:#f4fbff;
  --muted:#b7d7ea;
}
html,body{min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:#062c67}
body{overflow-x:hidden}

/* BACKGROUND */
.bg{
  position:fixed;inset:0;z-index:-10;
  background:
    linear-gradient(180deg,rgba(1,19,52,.18),rgba(1,17,47,.58)),
    url("anime-hub-bg.jpg") center/cover no-repeat;
  transform:scale(1.03);
}
.bg:after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 72% 25%,rgba(80,220,255,.20),transparent 34%),
    linear-gradient(90deg,rgba(1,20,55,.72),transparent 46%,rgba(0,20,55,.20));
}

/* FLOWING HAIR / LIGHT MOTION */
.hair-glow{
  position:fixed;z-index:-7;right:5%;top:8%;width:55vw;height:42vh;
  pointer-events:none;opacity:.55;filter:blur(7px);
  background:radial-gradient(ellipse,rgba(195,245,255,.24),transparent 66%);
  animation:hairFloat 7s ease-in-out infinite;
}
.hair-stream{
  position:fixed;z-index:-6;right:0;top:18%;width:52vw;height:38vh;
  pointer-events:none;opacity:.55;
}
.hair-stream span{
  position:absolute;right:0;width:72%;height:2px;
  border-radius:50%;background:linear-gradient(90deg,transparent,rgba(230,250,255,.62),transparent);
  transform-origin:right center;
  animation:stream 5s ease-in-out infinite;
}
.hair-stream span:nth-child(1){top:8%;animation-delay:0s}
.hair-stream span:nth-child(2){top:22%;width:84%;animation-delay:.8s}
.hair-stream span:nth-child(3){top:38%;width:62%;animation-delay:1.5s}
.hair-stream span:nth-child(4){top:57%;width:76%;animation-delay:2.2s}
.hair-stream span:nth-child(5){top:74%;width:55%;animation-delay:1.1s}

@keyframes stream{
  0%,100%{transform:translateX(0) rotate(-3deg);opacity:.25}
  50%{transform:translateX(-35px) rotate(3deg);opacity:.9}
}
@keyframes hairFloat{
  0%,100%{transform:translate(0,0) rotate(0)}
  50%{transform:translate(-18px,10px) rotate(2deg)}
}

/* WATER RIPPLE OVERLAY */
.water{
  position:fixed;left:-10%;right:-10%;bottom:-9%;height:43vh;z-index:-5;
  pointer-events:none;overflow:hidden;
  background:linear-gradient(180deg,transparent,rgba(34,178,255,.13));
}
.ripple{
  position:absolute;left:50%;top:52%;width:18vw;height:5vw;
  border:2px solid rgba(170,242,255,.28);border-radius:50%;
  transform:translate(-50%,-50%) scale(.2);
  box-shadow:0 0 24px rgba(70,210,255,.10);
  animation:ripple 6s linear infinite;
}
.ripple:nth-child(2){animation-delay:2s}
.ripple:nth-child(3){animation-delay:4s}
@keyframes ripple{
  0%{transform:translate(-50%,-50%) scale(.15);opacity:0}
  15%{opacity:.55}
  100%{transform:translate(-50%,-50%) scale(6);opacity:0}
}

/* PARTICLES */
.particles{position:fixed;inset:0;z-index:-4;pointer-events:none}
.particles i{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:rgba(220,250,255,.9);box-shadow:0 0 12px rgba(100,225,255,.9);
  animation:drift linear infinite;
}
@keyframes drift{
  from{transform:translate3d(0,110vh,0);opacity:0}
  15%{opacity:1}
  85%{opacity:.8}
  to{transform:translate3d(80px,-15vh,0);opacity:0}
}

/* HEADER */
header{
  position:fixed;top:0;left:0;right:0;height:70px;z-index:20;
  display:flex;align-items:center;gap:24px;padding:0 28px;
  background:rgba(2,21,55,.48);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.logo{font-size:27px;font-weight:900;font-style:italic;letter-spacing:2px}
.logo span{color:var(--cyan)}
.tagline{font-size:11px;letter-spacing:1.7px;color:#bfe6f6}
.search{
  margin-left:auto;width:min(390px,42vw);height:40px;
  display:flex;align-items:center;gap:10px;padding:0 14px;
  border:1px solid rgba(105,215,255,.34);border-radius:24px;
  background:rgba(0,36,82,.44);color:#dff7ff;
}
.search input{width:100%;border:0;outline:0;background:none;color:white;font-size:13px}
.search input::placeholder{color:#9bc1d8}
.icon-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  background:rgba(55,160,235,.18);color:white;cursor:pointer;
  transition:.25s;
}
.icon-btn:hover{transform:translateY(-2px);background:rgba(62,190,255,.34);box-shadow:0 0 22px rgba(55,210,255,.28)}

/* SIDEBAR */
.sidebar{
  position:fixed;left:0;top:70px;bottom:0;width:195px;z-index:15;
  padding:30px 13px;background:rgba(1,20,54,.48);
  backdrop-filter:blur(18px);border-right:1px solid var(--line);
}
.nav{display:grid;gap:8px}
.nav button{
  border:0;color:#d9f3ff;background:transparent;text-align:left;
  padding:13px 17px;border-radius:18px;font-size:14px;cursor:pointer;
  transition:.25s;
}
.nav button:hover,.nav button.active{
  background:linear-gradient(90deg,rgba(35,174,255,.30),rgba(35,174,255,.08));
  box-shadow:inset 0 0 0 1px rgba(105,220,255,.20),0 0 18px rgba(0,150,255,.10);
  transform:translateX(3px);
}
.quote{position:absolute;left:27px;right:22px;bottom:38px;color:#8fb8cd;font-size:12px;line-height:1.7;font-style:italic}

/* MAIN */
main{margin-left:195px;padding:105px 32px 60px;max-width:1450px;margin-right:auto}
.hero{
  min-height:390px;display:flex;align-items:center;position:relative;
  padding:35px 30px 20px;
  animation:rise .8s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.hero-copy{max-width:470px;z-index:2}
.kicker{font-size:14px;letter-spacing:2px;color:#83e7ff;margin-bottom:12px}
h1{font-size:clamp(44px,6vw,76px);line-height:.95;letter-spacing:-3px}
h1 span{color:#35dfff;text-shadow:0 0 24px rgba(0,221,255,.34)}
.hero-copy p{margin:22px 0;color:#d0eaf7;font-size:15px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{
  border:1px solid rgba(100,225,255,.42);border-radius:24px;
  padding:12px 20px;background:rgba(15,127,220,.28);color:white;
  cursor:pointer;font-weight:700;transition:.25s;
}
.btn.primary{background:linear-gradient(90deg,#159dff,#26d8ff);border:0}
.btn:hover{transform:translateY(-3px);box-shadow:0 9px 28px rgba(0,170,255,.25)}
.section{margin-top:15px;animation:rise .8s ease both}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
.section-head h2{font-size:20px}
.section-head button{border:0;background:none;color:#bdefff;cursor:pointer}
.row{
  display:grid;grid-template-columns:repeat(6,minmax(145px,1fr));gap:12px;
  overflow-x:auto;padding:4px 2px 12px;
}
.card{
  min-width:0;position:relative;border:1px solid rgba(130,225,255,.18);
  background:rgba(3,34,77,.58);border-radius:16px;overflow:hidden;
  backdrop-filter:blur(10px);cursor:pointer;transition:.3s;
}
.card:hover{transform:translateY(-7px) scale(1.015);border-color:rgba(100,230,255,.55);box-shadow:0 15px 35px rgba(0,25,75,.45)}
.poster{height:210px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0b4f8f,#10233e)}
.poster div{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:900;letter-spacing:1px;background:linear-gradient(135deg,rgba(0,100,190,.4),rgba(0,20,55,.8))}
.poster small{position:absolute;bottom:8px;right:8px;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.55)}
.card-info{padding:11px}
.card-info strong{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11px;color:#9fc6d9;margin-top:6px}
.rating{color:#ffe07c;margin-top:7px;font-size:12px}
.continue{
  margin-top:25px;padding:16px 20px;border-radius:17px;
  background:rgba(4,37,80,.58);border:1px solid var(--line);
  backdrop-filter:blur(14px);display:flex;align-items:center;gap:15px;
}
.progress{flex:1;height:5px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
.progress span{display:block;width:64%;height:100%;background:#35dfff}

/* MOBILE */
.mobile-menu{display:none}
@media(max-width:950px){
  .sidebar{width:75px}.sidebar .nav button{font-size:0;text-align:center}.sidebar .nav button:first-letter{font-size:18px}
  .quote{display:none}main{margin-left:75px}.tagline{display:none}
  .row{grid-template-columns:repeat(6,180px)}
}
@media(max-width:650px){
  header{padding:0 13px;gap:9px}.logo{font-size:22px}.search{width:auto;flex:1}
  .sidebar{display:none}.mobile-menu{display:block}
  main{margin-left:0;padding:92px 14px 45px}
  .hero{min-height:330px;padding:20px 10px;align-items:flex-end}
  .hero-copy{max-width:100%;padding-bottom:15px}
  h1{font-size:47px}
  .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,15,45,.88),transparent 70%);z-index:0}
  .hero-copy{z-index:1}
  .row{grid-template-columns:repeat(6,175px)}
  .poster{height:235px}
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="hair-glow"></div>
<div class="hair-stream"><span></span><span></span><span></span><span></span><span></span></div>
<div class="water"><div class="ripple"></div><div class="ripple"></div><div class="ripple"></div></div>
<div class="particles" id="particles"></div>

<header>
  <button class="icon-btn mobile-menu" onclick="toggleSidebar()">☰</button>
  <div class="logo">NEXUS<span>.</span></div>
  <div class="tagline">YOUR ANIME UNIVERSE</div>
  <label class="search">⌕ <input id="searchInput" placeholder="Search anime, genres, or characters..." oninput="searchAnime()"></label>
  <button class="icon-btn" title="Notifications">♧</button>
  <button class="icon-btn" title="Profile" onclick="location.href='dashboard.html'">◯</button>
</header>

<aside class="sidebar" id="sidebar">
  <nav class="nav">
    <button class="active">⌂ &nbsp; Home</button>
    <button>◈ &nbsp; Browse</button>
    <button>♡ &nbsp; My List</button>
    <button>◷ &nbsp; Watch History</button>
    <button>♥ &nbsp; Favorites</button>
    <button>⚙ &nbsp; Settings</button>
  </nav>
  <div class="quote">“Good anime<br>makes a better<br>tomorrow.”<br><br>—</div>
</aside>

<main>
  <section class="hero">
    <div class="hero-copy">
      <div class="kicker">WELCOME TO</div>
      <h1>ANIME <span>HUB.</span></h1>
      <p>Discover. Watch. Explore.</p>
      <div class="actions">
        <button class="btn primary" onclick="scrollToSection('trending')">▶ Start Watching</button>
        <button class="btn" onclick="scrollToSection('trending')">Browse Anime</button>
      </div>
    </div>
  </section>

  <section class="section" id="trending">
    <div class="section-head"><h2>🔥 Trending Now</h2><button onclick="showMessage()">View All →</button></div>
    <div class="row" id="trendingRow"></div>
  </section>

  <section class="section" id="latest">
    <div class="section-head"><h2>▷ Latest Episodes</h2><button onclick="showMessage()">View All →</button></div>
    <div class="row" id="latestRow"></div>
  </section>

  <div class="continue">
    <strong>◫ &nbsp; Continue Watching</strong>
    <div class="progress"><span></span></div>
    <button class="icon-btn" onclick="showMessage()">→</button>
  </div>
</main>

<script>
const trending=[
  ["Solo Leveling","Action • Fantasy • Adventure","9.1","S"],
  ["Jujutsu Kaisen","Action • Supernatural • School","8.7","J"],
  ["Demon Slayer","Action • Fantasy • Adventure","8.9","D"],
  ["Attack on Titan","Action • Drama • Mystery","9.0","A"],
  ["Tokyo Revengers","Action • Drama • School","8.3","T"],
  ["Your Name","Romance • Drama • Fantasy","9.2","Y"]
];
const latest=[
  ["One Piece","S1 E1123 • 23 min","OP","23:45"],
  ["Naruto Shippuden","S6 E278 • 22 min","N","22:30"],
  ["Blue Lock","S1 E24 • 24 min","B","24:12"],
  ["Haikyuu!!","S4 E12 • 23 min","H","23:07"],
  ["Dandadan","S1 E10 • 22 min","D","22:41"],
  ["Frieren","S1 E16 • 27 min","F","26:58"]
];

function card(data,latestCard=false){
  if(latestCard){
    return `<article class="card" onclick="showMessage()">
      <div class="poster"><div>${data[2]}</div><small>${data[3]}</small></div>
      <div class="card-info"><strong>${data[0]}</strong><div class="meta">${data[1]}</div></div>
    </article>`;
  }
  return `<article class="card" onclick="showMessage()">
    <div class="poster"><div>${data[3]}</div></div>
    <div class="card-info"><strong>${data[0]}</strong><div class="meta">${data[1]}</div><div class="rating">★ ${data[2]}</div></div>
  </article>`;
}
function render(){
  document.getElementById("trendingRow").innerHTML=trending.map(x=>card(x)).join("");
  document.getElementById("latestRow").innerHTML=latest.map(x=>card(x,true)).join("");
}
function searchAnime(){
  const q=document.getElementById("searchInput").value.toLowerCase().trim();
  document.querySelectorAll(".card").forEach(c=>{
    c.style.display=!q || c.innerText.toLowerCase().includes(q) ? "" : "none";
  });
}
function scrollToSection(id){document.getElementById(id).scrollIntoView({behavior:"smooth"})}
function showMessage(){alert("Anime browsing is ready for the next step. 🎬")}
function toggleSidebar(){
  const s=document.getElementById("sidebar");
  s.style.display=s.style.display==="block"?"none":"block";
}
for(let i=0;i<24;i++){
  const p=document.createElement("i");
  p.style.left=Math.random()*100+"%";
  p.style.animationDuration=(7+Math.random()*9)+"s";
  p.style.animationDelay=(-Math.random()*12)+"s";
  p.style.transform=`scale(${.5+Math.random()*1.4})`;
  document.getElementById("particles").appendChild(p);
}
render();
</script>
</body>
</html>
