<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — Private Chat</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}
body{min-height:100vh;overflow-x:hidden}
.chat-background{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.orb{position:absolute;width:300px;height:300px;border-radius:50%;filter:blur(90px);opacity:.16;animation:floatOrb 10s ease-in-out infinite}
.orb-one{top:-100px;left:-80px}.orb-two{right:-100px;bottom:-100px;animation-delay:-4s}.orb-three{top:40%;left:45%;width:200px;height:200px;animation-delay:-7s}
@keyframes floatOrb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-30px) scale(1.15)}}
.chat-page{width:min(1200px,94%);margin:0 auto;padding:30px 0 40px}
.chat-heading{margin-bottom:25px;animation:pageDrop .7s ease both}
.chat-heading .welcome{margin-bottom:8px}.chat-heading h1{margin:0}.chat-heading p{opacity:.65}
@keyframes pageDrop{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.chat-window{display:grid;grid-template-columns:300px 1fr;height:650px;border:1px solid rgba(255,255,255,.1);border-radius:22px;overflow:hidden;background:rgba(10,10,20,.45);backdrop-filter:blur(20px);box-shadow:0 0 60px rgba(255,255,255,.04);animation:chatAppear .8s ease both}
@keyframes chatAppear{from{opacity:0;transform:scale(.97) translateY(15px)}to{opacity:1;transform:scale(1) translateY(0)}}
.users-panel{border-right:1px solid rgba(255,255,255,.08);padding:20px;background:rgba(0,0,0,.18)}
.users-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.users-title h3{margin:0}
.status-dot{width:9px;height:9px;border-radius:50%;background:#7dffb2;box-shadow:0 0 10px rgba(125,255,178,.8);animation:pulseStatus 1.8s infinite}
@keyframes pulseStatus{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.55}}
.new-chat-button{width:100%;padding:12px 14px;margin-bottom:10px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.08);color:white;cursor:pointer;font-weight:600;transition:.25s}.new-chat-button:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.mobile-users-button{display:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:white;border-radius:10px;padding:9px 11px;cursor:pointer}
.mobile-overlay{display:none}
.user-search{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);color:white;outline:none;transition:border .25s ease,box-shadow .25s ease}
.user-search:focus{border-color:rgba(255,255,255,.35);box-shadow:0 0 20px rgba(255,255,255,.05)}
.users-list{margin-top:18px;height:calc(100% - 155px);overflow-y:auto}
.user-item{padding:13px;margin-bottom:8px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:transform .25s ease,background .25s ease,border .25s ease}
.user-item:hover{transform:translateX(5px);background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
.user-item.active{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.user-name{font-weight:600}.user-handle{font-size:12px;opacity:.5;margin-top:3px}
.chat-area{display:flex;flex-direction:column;min-width:0}
.chat-header{min-height:75px;padding:15px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
.chat-person{display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);font-weight:bold}
.chat-person-name{font-weight:600}.chat-person-status{font-size:12px;opacity:.5;margin-top:3px}
.messages{flex:1;padding:25px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.message{max-width:75%;padding:11px 15px;border-radius:16px;line-height:1.5;word-break:break-word;animation:messageIn .35s ease both}
@keyframes messageIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.message.sent{align-self:flex-end;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-bottom-right-radius:5px}
.message.received{align-self:flex-start;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:5px}
.message-time{display:block;margin-top:5px;font-size:10px;opacity:.4}
.delete-message{display:block;margin-top:5px;border:none;background:transparent;color:inherit;opacity:.35;cursor:pointer;font-size:11px}.delete-message:hover{opacity:.8}
.empty-chat{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;opacity:.45;padding:30px}
.empty-chat-icon{font-size:40px;margin-bottom:15px;animation:floatingIcon 3s ease-in-out infinite}
@keyframes floatingIcon{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.typing{display:none;padding:0 25px 10px;font-size:12px;opacity:.5}
.typing span{display:inline-block;width:5px;height:5px;margin-left:3px;border-radius:50%;background:currentColor;animation:typingDot 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes typingDot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.message-input-area{padding:15px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:10px}
.message-input{flex:1;min-width:0;padding:14px 16px;border-radius:13px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);color:white;outline:none;transition:border .25s ease,box-shadow .25s ease}
.message-input:focus{border-color:rgba(255,255,255,.35);box-shadow:0 0 20px rgba(255,255,255,.05)}
.send-button{width:50px;border:none;border-radius:13px;cursor:pointer;background:rgba(255,255,255,.1);color:white;transition:transform .2s ease,background .2s ease}
.send-button:hover{transform:translateY(-2px);background:rgba(255,255,255,.18)}.send-button:active{transform:scale(.92)}
@media(max-width:800px){
.chat-window{grid-template-columns:1fr;height:700px}.message{max-width:85%}
.users-panel{position:fixed;z-index:100;left:0;top:0;bottom:0;width:min(340px,88vw);transform:translateX(-105%);transition:transform .3s ease;box-shadow:20px 0 60px rgba(0,0,0,.5)}
.users-panel.open{transform:translateX(0)}
.mobile-users-button{display:block}
.mobile-overlay{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.mobile-overlay.open{display:block}
}
@media(max-width:500px){.chat-page{width:96%;padding-top:20px}.chat-window{border-radius:16px}.messages{padding:15px}.chat-header{padding:12px 15px}}
</style>
</head>
<body>
<div id="mobileOverlay" class="mobile-overlay" onclick="closeUsers()"></div>
<div class="chat-background"><div class="orb orb-one"></div><div class="orb orb-two"></div><div class="orb orb-three"></div></div>

<header>
<div class="logo">NEXUS<span>.</span></div>
<button class="secondary" onclick="goBack()">← BACK</button>
</header>

<main class="chat-page">
<section class="chat-heading">
<p class="welcome">NEXUS COMMUNICATION</p>
<h1>PRIVATE <span>CHAT.</span></h1>
<p>Secure conversations between NEXUS users.</p>
</section>

<section class="chat-window">
<aside class="users-panel">
<div class="users-title"><h3>USERS</h3><div class="status-dot"></div></div>
<button class="new-chat-button" onclick="startNewChat()">＋ NEW CHAT</button>
<input id="userSearch" class="user-search" type="text" placeholder="Search users..." oninput="searchUsers()">
<div id="usersList" class="users-list"><div class="empty-chat">Tap NEW CHAT, then search for a user.</div></div>
</aside>

<section class="chat-area">
<div class="chat-header">
<div class="chat-person">
<div id="chatAvatar" class="avatar">?</div>
<div><div id="chatName" class="chat-person-name">Select a user</div><div id="chatStatus" class="chat-person-status">Choose someone to start chatting</div></div>
</div>
<button class="mobile-users-button" onclick="openUsers()">👥 Users</button>
</div>

<div id="messages" class="messages">
<div class="empty-chat"><div><div class="empty-chat-icon">◈</div><div>Select a NEXUS user to begin.</div></div></div>
</div>

<div id="typing" class="typing">User is typing <span></span><span></span><span></span></div>

<div class="message-input-area">
<input id="messageInput" class="message-input" type="text" placeholder="Select a user first..." disabled onkeydown="handleEnter(event)">
<button id="sendButton" class="send-button" onclick="sendMessage()" disabled>➤</button>
</div>
</section>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://zgeswrhyhxgwcgcgnsti.supabase.co";
const SUPABASE_KEY="sb_publishable_GX9S4EVFF4Lf_BRMETV80g_oEavE6Up";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null,selectedUser=null,currentConversation=null,allUsers=[],realtimeChannel=null;

async function checkUser(){
 const {data:{user}}=await supabaseClient.auth.getUser();
 if(!user){window.location.href="index.html";return}
 currentUser=user;
}

async function searchUsers(){
 const query=document.getElementById("userSearch").value.trim().toLowerCase();
 if(!query){document.getElementById("usersList").innerHTML='<div class="empty-chat">Search for a user.</div>';return}
 const {data,error}=await supabaseClient.from("profiles").select("id, username, display_name, avatar_url").neq("id",currentUser.id).or(`username.ilike.%${query}%,display_name.ilike.%${query}%`).limit(20);
 if(error){console.error(error);return}
 allUsers=data||[];displayUsers(allUsers);
}

function displayUsers(users){
 const list=document.getElementById("usersList");
 if(!users.length){list.innerHTML='<div class="empty-chat">No users found.</div>';return}
 list.innerHTML="";
 users.forEach(user=>{
  const item=document.createElement("div");
  item.className="user-item";
  item.innerHTML=`<div class="user-name">${escapeHTML(user.display_name||user.username||"User")}</div><div class="user-handle">@${escapeHTML(user.username||"user")}</div>`;
  item.onclick=()=>selectUser(user);
  list.appendChild(item);
 });
}

async function selectUser(user){
 selectedUser=user;
 document.getElementById("chatName").textContent=user.display_name||user.username||"User";
 document.getElementById("chatStatus").textContent="NEXUS user";
 document.getElementById("chatAvatar").textContent=(user.display_name||user.username||"U").charAt(0).toUpperCase();
 document.getElementById("messageInput").disabled=false;
 document.getElementById("sendButton").disabled=false;
 document.getElementById("messageInput").placeholder="Write a message...";
 closeUsers();
 await getOrCreateConversation();
}

async function getOrCreateConversation(){
 const one=currentUser.id<selectedUser.id?currentUser.id:selectedUser.id;
 const two=currentUser.id<selectedUser.id?selectedUser.id:currentUser.id;
 let {data,error}=await supabaseClient.from("conversations").select("*").eq("user_one",one).eq("user_two",two).maybeSingle();
 if(error){alert(error.message);return}
 if(!data){
  const result=await supabaseClient.from("conversations").insert({user_one:one,user_two:two}).select().single();
  if(result.error){alert(result.error.message);return}
  data=result.data;
 }
 currentConversation=data;
 await loadMessages();
 subscribeToMessages();
}

async function loadMessages(){
 if(!currentConversation)return;
 const {data,error}=await supabaseClient.from("messages").select("*").eq("conversation_id",currentConversation.id).order("created_at",{ascending:true});
 if(error){alert(error.message);return}
 const container=document.getElementById("messages");
 container.innerHTML="";
 if(!data||!data.length){container.innerHTML='<div class="empty-chat">No messages yet.<br>Start the conversation.</div>';return}
 data.forEach(message=>renderMessage(message));scrollMessages();
}

function renderMessage(message){
 const container=document.getElementById("messages");
 const empty=container.querySelector(".empty-chat");if(empty)empty.remove();
 const messageElement=document.createElement("div");
 const sent=message.sender_id===currentUser.id;
 messageElement.className="message "+(sent?"sent":"received");
 const time=new Date(message.created_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
 messageElement.innerHTML=`<div>${escapeHTML(message.content)}</div><span class="message-time">${time}</span>${sent?`<button class="delete-message" onclick="deleteMessage('${message.id}')">Delete</button>`:""}`;
 messageElement.dataset.id=message.id;
 container.appendChild(messageElement);
 scrollMessages();
}

async function sendMessage(){
 if(!currentConversation)return;
 const input=document.getElementById("messageInput");
 const content=input.value.trim();if(!content)return;
 input.value="";
 const {error}=await supabaseClient.from("messages").insert({conversation_id:currentConversation.id,sender_id:currentUser.id,content});
 if(error){alert(error.message);input.value=content;}
}

async function deleteMessage(id){
 if(!confirm("Delete this message?"))return;
 const {error}=await supabaseClient.from("messages").delete().eq("id",id).eq("sender_id",currentUser.id);
 if(error){alert(error.message);return}
 const element=document.querySelector(`[data-id="${id}"]`);
 if(element){element.style.opacity="0";element.style.transform="translateY(-8px)";setTimeout(()=>element.remove(),250)}
}

function subscribeToMessages(){
 if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
 realtimeChannel=supabaseClient.channel("messages-"+currentConversation.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"conversation_id=eq."+currentConversation.id},payload=>{
  if(!document.querySelector(`[data-id="${payload.new.id}"]`))renderMessage(payload.new);
 }).subscribe();
}

function handleEnter(event){
 if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();sendMessage();}
}

function scrollMessages(){
 const container=document.getElementById("messages");
 container.scrollTo({top:container.scrollHeight,behavior:"smooth"});
}

function escapeHTML(text){
 return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function startNewChat(){
document.getElementById("userSearch").value="";
document.getElementById("usersList").innerHTML='<div class="empty-chat">Type a username or display name above.</div>';
openUsers();
document.getElementById("userSearch").focus();
}
function openUsers(){
document.getElementById("usersPanel").classList.add("open");
document.getElementById("mobileOverlay").classList.add("open");
}
function closeUsers(){
document.getElementById("usersPanel").classList.remove("open");
document.getElementById("mobileOverlay").classList.remove("open");
}
function goBack(){window.location.href="dashboard.html";}
checkUser();
</script>
</body>
</html>
